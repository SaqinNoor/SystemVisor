name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so auto-generated release notes can compare against the previous tag
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Get version from tag
        id: version
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/v", "")
          echo "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Rename binary for distribution
        run: |
          $exePath = "target/release/systemvisor.exe"
          $distExe = "systemvisor.exe"
          Copy-Item $exePath $distExe

      - name: Create portable ZIP
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "systemvisor-v$version-portable.zip"
          Compress-Archive -Path systemvisor.exe, README.md -DestinationPath $zipName

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          # GitHub auto-generates release notes from commits and PRs since the last tag.
          # No manual release notes needed — push a tag and this fills itself in.
          generate_release_notes: true
          body: |
            ## SystemVisor v${{ steps.version.outputs.version }}

            A lightweight, high-performance Windows 11 system monitor for the terminal — real-time CPU, memory, disk, network, and a live DSP audio spectrum visualizer.

            ### Features
            - **Per-core CPU matrix** — Auto-layout grid scaling to your logical core count
            - **Memory & swap tracking** — Visualized with sparklines and gauges
            - **Disk & network I/O** — Live throughput and totals
            - **Process table** — Sortable by CPU, memory, PID, or name
            - **Media dashboard** — GSMTC session metadata, album art, playback status
            - **Real-time FFT spectrum** — 16-band musically-calibrated audio visualizer via WASAPI loopback
            - **Zero-emoji UI** — Clean professional terminal aesthetics with Unicode block elements

            ### Installation
            Download `systemvisor.exe` and run directly on Windows 11. No runtime dependencies.

            ```powershell
            .\systemvisor.exe
            ```

            ### Controls
            | Key | Action |
            |-----|--------|
            | `q` | Quit |
            | `Tab` / `s` | Cycle sort column |
            | `r` | Reverse sort order |
            | `1`–`4` | Jump to sort column |
            | `j` / `k` | Scroll process list |

            ---
            *What changed in this release is listed automatically below by GitHub.*
          files: |
            systemvisor.exe
            systemvisor-v${{ steps.version.outputs.version }}-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
